<script type="module">
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    // TWÓJ KLUCZ API
    const API_KEY = "AIzaSyDBSuJPySlhNMp6hIeqU0MP5vu_z_M6DvM"; 

    const genAI = new GoogleGenerativeAI(API_KEY);
    
    // ZMIANA: Używamy pełnej nazwy modelu i sprawdzamy połączenie
    const model = genAI.getGenerativeModel({ 
        model: "gemini-1.5-flash",
    });

    let chats = JSON.parse(localStorage.getItem('straw_chats')) || [];
    let currentChatId = null;

    // Funkcja wysyłania - ulepszona
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;
        if (!currentChatId) createNewChat();

        const chat = chats.find(c => c.id === currentChatId);
        if (chat.messages.length === 0) chat.title = text.substring(0, 25) + "...";

        chat.messages.push({ role: 'user', text });
        input.value = '';
        loadChat(currentChatId);

        try {
            // Dodajemy systemInstruction bezpośrednio do zapytania, co jest pewniejsze
            const prompt = "Jesteś StrawAI, ekspertem Linux CachyOS dla mojego taty. Odpowiadaj po polsku. Pytanie: " + text;
            const result = await model.generateContent(prompt);
            const response = await result.response;
            const aiText = response.text();

            chat.messages.push({ role: 'ai', text: aiText });
            saveAndRender();
            loadChat(currentChatId);
        } catch (e) {
            console.error(e);
            // Wyświetlamy konkretny błąd w oknie czatu
            chat.messages.push({ role: 'ai', text: "Błąd połączenia z API. Spróbuj odświeżyć stronę za chwilę." });
            loadChat(currentChatId);
        }
    }

    // Pozostałe funkcje (createNewChat, loadChat, renderChatList, saveAndRender) zostają takie same jak wcześniej...
    // Pamiętaj, żeby upewnić się, że są one wewnątrz tego tagu <script>
</script>
